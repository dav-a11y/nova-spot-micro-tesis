gait_controller:
  ros__parameters:
    initial_gait: stand
    crawl_phase_duration: 0.18
    crawl_samples: 24
    crawl_step_length: 0.018
    crawl_step_height: 0.014
    crawl_lateral_shift: 0.004
    crawl_fore_aft_shift: 0.008
    # Altura normalizada al 75 % de la oscilación. El valor parametriza toda la
    # curva de descenso desde el ápice hasta touchdown: valores menores bajan
    # antes y valores mayores sostienen la elevación. Con 24 muestras conserva
    # exactamente la referencia nominal previa. Ajustar únicamente en ensayos
    # exploratorios y congelar después de validar contactos.
    crawl_front_landing_height_ratio: 0.7071067811865476
    crawl_rear_landing_height_ratio: 0.7071067811865476
    # Altura normalizada al 25 % de la oscilación trasera. El nominal conserva
    # el seno histórico; valores mayores aceleran la liberación temprana sin
    # cambiar la elevación máxima. Mantener nominal fuera de exploraciones.
    crawl_rear_liftoff_height_ratio: 0.7071067811865476
    step_phase_duration: 0.12
    step_samples: 48
    step_length: 0.016
    step_height: 0.008
    step_weight_shift: 0.004
    # Nominal histórico: sin transferencia longitudinal. Los candidatos deben
    # ensayarse como configuraciones separadas antes de cambiar este valor.
    step_fore_aft_shift: 0.0
    gallop_phase_duration: 0.20
    # Fuera del alcance principal; no habilitar en hardware.
    enable_experimental_gallop: false
    transition_ratio: 0.90
    command_topic: /nova/gait_command
    phase_topic: /nova/gait_phase
    trajectory_topic: /joint_trajectory_controller/joint_trajectory
